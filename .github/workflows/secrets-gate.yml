name: secrets-gate
on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Personal-layer files must never be tracked
        run: |
          set -e
          BAD=$(git ls-files | grep -E '(^|/)\.env$|config\.local\.json|feedback\.log|metrics\.csv' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Personal/secret files tracked in git:"; echo "$BAD"; exit 1
          fi
      - name: No credential patterns in tracked files
        run: |
          set -e
          HITS=$(git grep -I -n -E \
            "(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|xoxb-[A-Za-z0-9-]{10,}|[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}|AKIA[0-9A-Z]{16})" \
            || true)
          if [ -n "$HITS" ]; then
            echo "::error::Credential-shaped strings found:"; echo "$HITS"; exit 1
          fi
      - name: Identity must stay neutral in committed config
        run: |
          set -e
          python3 - <<'EOF'
          import json, sys
          cfg = json.load(open('pipeline/config.json'))
          ident = cfg.get('identity', {})
          if ident.get('name') not in ('', 'Your Name'):
              sys.exit("::error::pipeline/config.json identity block is personalized — move it to config.local.json")
          if cfg.get('video', {}).get('avatarLooks'):
              sys.exit("::error::avatarLooks in committed config — move to config.local.json")
          EOF
      - name: Pipeline compiles
        run: |
          cd pipeline && for f in *.py; do python3 -m py_compile "$f"; done
